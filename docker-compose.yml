services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: pso-surveillance:latest
    container_name: pso-api
    restart: unless-stopped
    env_file: .env
    ports:
      - "${PSO_API_PORT:-8080}:8080"
    volumes:
      - ./config:/app/config:ro
      - ./models:/app/models:ro
      - ./data:/app/data
    command:
      [
        "uvicorn",
        "src.api.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8080",
        "--proxy-headers",
      ]
    # Uncomment on the edge box with an NVIDIA GPU (requires nvidia-container-toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:8080/health',timeout=2)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    image: pso-dashboard:latest
    container_name: pso-dashboard
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:80"
    environment:
      - VITE_API_URL=http://localhost:${PSO_API_PORT:-8080}
