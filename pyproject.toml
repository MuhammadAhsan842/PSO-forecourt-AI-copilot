[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pso-surveillance"
version = "0.1.0"
description = "PSO Forecourt AI Surveillance — pilot on existing Dahua PTZ cameras"
requires-python = ">=3.11"
authors = [{ name = "M. Resolutions" }]
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "loguru>=0.7",
    "pyyaml>=6.0",
    "shapely>=2.0",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "onvif-zeep>=0.2.12",
    "httpx>=0.27",
    "requests>=2.32",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "websockets>=12",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
]

[project.optional-dependencies]
inference = [
    "torch>=2.3",
    "torchvision>=0.18",
    "ultralytics>=8.3",
    "onnxruntime-gpu>=1.18; platform_system=='Linux'",
    "onnxruntime>=1.18; platform_system!='Linux'",
]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "types-PyYAML",
    "types-requests",
    "httpx>=0.27",
]

[project.scripts]
pso-api = "src.api.main:run"
pso-probe = "scripts.camera_probe:main"
pso-baseline = "scripts.capture_baseline:main"
pso-replay = "scripts.replay_clip:main"
pso-report = "scripts.report:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "TID", "RUF"]
ignore = [
    "E501",   # long lines handled by formatter
    "B008",   # FastAPI's `Depends(...)` idiom uses default-arg call
    "UP042",  # str,Enum vs StrEnum — StrEnum values are compared as strings, we prefer explicit
    "RUF002", # unicode symbols like × / − appear in the domain (meter arithmetic) on purpose
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
